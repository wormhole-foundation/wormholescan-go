name: Spec Drift

# Fetches the served Wormholescan Swagger document weekly and opens (or
# updates) one issue when it differs from the committed api/spec/swagger.json.
# The issue is the signal to run `moon run root:spec-fetch`, review the diff
# against api/spec/patch.jq, and regenerate.

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    name: Compare served spec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.6.14
          cache: true

      - name: Fetch served spec and diff
        id: diff
        run: |
          set -euo pipefail
          moon run root:spec-fetch --summary minimal
          if git diff --quiet -- api/spec/swagger.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'The served spec at https://api.wormholescan.io/swagger.json differs from `api/spec/swagger.json`.'
            echo
            echo 'Run `moon run root:spec-fetch`, review the diff against `api/spec/patch.jq`, then `moon run root:gen`.'
            echo
            echo '```diff'
            git diff --stat -- api/spec/swagger.json
            echo
            git diff -- api/spec/swagger.json | head -400
            echo '```'
          } > issue-body.md

      - name: Open or update the drift issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Served Wormholescan spec drifted from api/spec/swagger.json"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue-body.md
          else
            gh issue create --title "$title" --label spec-drift --body-file issue-body.md
          fi
