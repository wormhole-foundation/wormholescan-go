language: 'go'
layer: 'library'
stack: 'backend'

project:
  title: 'wormholescan-go'
  description: 'Go client SDK for the Wormholescan API.'
  owner: 'wormhole-foundation'
  maintainers:
    - 'wormhole-foundation'

# Every task runs against `system` binaries that mise (mise.toml + mise.lock) puts
# on PATH; moon manages no language toolchain itself.
toolchains:
  default: 'system'

fileGroups:
  goSources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
    # Tool/version pins. Under the `system` toolchain moon does not hash the Go
    # binary's version, so the mise pins are inputs here too — bumping Go (or any
    # tool) in mise must invalidate the cacheable build task.
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - 'release-please-config.json'
    - '.release-please-manifest.json'
  spec:
    - 'api/spec/swagger.json'
    - 'api/spec/patch.jq'
    - 'api/spec/oapi-codegen.yaml'
    - 'internal/specgen/**/*.go'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    command: 'golangci-lint run --allow-parallel-runners --config .golangci.yml ./... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  # Unit tests only: nothing outside integration/ needs Docker or the network
  # (AGENTS.md T4). Tests that need containers go under integration/ behind the
  # `integration` build tag, with their own task, when they exist.
  test:
    command: 'go test ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  # Refresh the committed copy of the served Wormholescan spec. Formatting is
  # normalized so a diff shows only upstream changes.
  spec-fetch:
    script: 'curl -fsSL https://api.wormholescan.io/swagger.json | jq . > api/spec/swagger.json'
    options:
      cache: false
      # No inputs, so moon ci would treat it as always affected and rewrite the
      # spec (truncating it while gen-check reads it).
      runInCI: false

  # Regenerate api/api.gen.go: patch the served spec, convert it to OpenAPI 3,
  # run oapi-codegen. Intermediate files never leave the temp dir.
  gen:
    script: |
      set -euo pipefail
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      jq -f api/spec/patch.jq api/spec/swagger.json > "$tmp/patched.json"
      go run ./internal/specgen "$tmp/patched.json" "$tmp/openapi.json"
      go tool oapi-codegen -config api/spec/oapi-codegen.yaml "$tmp/openapi.json"
    inputs:
      - '@group(spec)'
    outputs:
      - 'api/api.gen.go'
    options:
      cache: false

  # CI gate: after gen, the committed api/api.gen.go is unchanged, i.e. it
  # matches the committed spec + patch.
  gen-check:
    command: 'git diff --exit-code -- api/api.gen.go'
    deps:
      - 'root:gen'
    inputs:
      - '@group(spec)'
      - 'api/api.gen.go'
    options:
      cache: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'root:gen-check'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
    options:
      cache: false
      runInCI: true
